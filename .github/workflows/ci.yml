name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:integration@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app scripts tests
      - run: python -m pip install ruff==0.14.0
      - run: ruff check --select E4,E7,E9,F63,F7,F82 --ignore E402 app scripts tests
      - run: python -m unittest discover -s tests -v
