name: Integration smoke
on:
  push:
    branches: ["main", "feat/dual-deployment-modes"]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, panel, panel-network]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare isolated topology
        run: |
          echo "REMNAUM_BUILD_VERSION=$(python3 scripts/release_version.py)" >> "$GITHUB_ENV"
          cp .env.example .env
          # Replace the documented placeholder before starting production-mode containers.
          sed -i 's|^APP_SECRET_KEY=.*|APP_SECRET_KEY=integration-test-only-secret-do-not-use-in-production-123456|' .env
          sed -i 's|^TELEGRAM_WEBHOOK_SECRET=.*|TELEGRAM_WEBHOOK_SECRET=integration-test-only-webhook-secret-123456789|' .env
          chmod 600 .env
          if [ "${{ matrix.mode }}" = panel ]; then
            sed -i 's|^DEPLOY_MODE=.*|DEPLOY_MODE=panel|' .env
            sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.panel.yaml|' .env
          elif [ "${{ matrix.mode }}" = panel-network ]; then
            docker network create remnawave-network
            sed -i 's|^DEPLOY_MODE=.*|DEPLOY_MODE=panel|' .env
            sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.panel.yaml:compose.panel-network.yaml|' .env
            sed -i 's|^REMNAUM_PROXY_NETWORK=.*|REMNAUM_PROXY_NETWORK=remnawave-network|' .env
          fi
      - name: Validate scripts, installer and Compose isolation
        run: |
          sh -n install.sh bootstrap.sh
          python3 -m py_compile scripts/install.py scripts/check_updates.py scripts/remnawave_setup.py scripts/backup_manager.py scripts/terminal_ui.py
          bash -n update.sh backup.sh
          python3 -m py_compile scripts/install.py
          python3 -m unittest discover -s tests -p 'test_installer.py' -v
          docker compose config --quiet
          python3 - <<'PY'
          import json
          import subprocess
          import os
          data = json.loads(subprocess.check_output(["docker", "compose", "config", "--format", "json"], text=True))
          mode = "${{ matrix.mode }}"
          services = data["services"]
          if mode == "standalone":
              assert "caddy" in services and "nginx" in services, services
              assert {str(p["published"]) for p in services["caddy"]["ports"]} >= {"80","443"}
              assert not services["app"].get("ports")
              assert services["caddy"]["environment"]["BROWSER_SITE"] == ", web.example.com"
          else:
              assert "caddy" not in services and "nginx" not in services
              ports = services["app"]["ports"]
              assert len(ports) == 1 and ports[0]["host_ip"] == "127.0.0.1", ports
              assert str(ports[0]["published"]) == "18080"
              if mode == "panel-network":
                  assert "panel_proxy" in services["app"]["networks"]
          print("Deployment mode", mode, "validated")
          PY
      - name: Validate Caddy configuration (standalone only)
        if: matrix.mode == 'standalone'
        run: docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Simulate existing Panel owning public 80/443
        if: matrix.mode != 'standalone'
        run: |
          docker run -d --name simulated-panel-proxy -p 80:80 -p 443:80 nginx:1.27-alpine
      - name: Start empty database and API
        run: docker compose up -d --build postgres redis app
      - name: Validate Nginx configuration (standalone only)
        if: matrix.mode == 'standalone'
        run: docker compose run --rm --no-deps --entrypoint nginx nginx -t
      - name: Verify upgrade PostgreSQL credentials against the existing volume
        run: |
          app="$(docker compose ps -q app)"
          probe=(docker compose run --rm --no-deps -T --entrypoint python)
          "${probe[@]}" app -m app.db.check_connection
          if output=$("${probe[@]}" -e DATABASE_URL=postgresql+asyncpg://remnaum:invalid-test-password@postgres:5432/remnaum app -m app.db.check_connection 2>&1); then
            echo "Unexpected success with an incorrect password"
            exit 1
          fi
          grep -Fq 'PostgreSQL отклонил пароль из DATABASE_URL' <<< "$output"
          if grep -Fq 'invalid-test-password' <<< "$output"; then
            echo "PostgreSQL probe printed a password"
            exit 1
          fi
          test "$(docker compose ps -q app)" = "$app"
          "${probe[@]}" app -m app.db.check_connection
      - name: Verify health and clean data
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8080/health').status)" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8080/health').status == 200"
          docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8080/ready').status == 200"
          if [ "${{ matrix.mode }}" != standalone ]; then
            curl -fsS http://127.0.0.1:18080/health
            test "$(docker inspect -f '{{.State.Running}}' simulated-panel-proxy)" = "true"
          fi
          if [ "${{ matrix.mode }}" = panel-network ]; then
            docker compose exec -T app python -c "import socket; assert socket.gethostbyname('remnaum-api')"
          fi
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT version_num FROM alembic_version;')" = "0010_payment_expiry"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM users;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM payments;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM subscriptions;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM referral_rewards;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM remnawave_events;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM store_payment_settings;')" = "0"
          for table in promo_codes promo_redemptions trial_settings trial_claims store_documents store_notification_settings user_notification_preferences subscription_notifications store_operations_settings google_identities support_tickets support_replies user_themes; do
            test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc "SELECT COUNT(*) FROM $table;")" = "0"
          done
          docker compose exec -T app python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          base = 'http://127.0.0.1:8080'
          def request(path, method='GET', host='miniapp.example.com', payload=None):
              headers={'Host': host}
              if payload is not None:
                  headers['Content-Type']='application/json'
              req = urllib.request.Request(base + path, method=method, headers=headers,
                                           data=payload.encode() if payload is not None else None)
              try:
                  return urllib.request.urlopen(req, timeout=5)
              except urllib.error.HTTPError as exc:
                  return exc
          assert request('/store', host='web.example.com').status == 200
          assert request('/').status == 200
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(
                  urllib.request.Request(base + '/', headers={'Host': 'web.example.com'}), timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 307 and exc.headers['Location'] == '/auth'
          else:
              raise AssertionError("Browser guests must be sent to the login page")
          assert request('/auth', host='web.example.com').status == 200
          assert request('/', host='webhook.example.com').status == 404
          assert request('/app').status == 200
          admin = request('/admin')
          assert admin.status == 200
          markup = admin.read().decode()
          assert 'id="remnaum-version"' in markup
          assert '/static/admin.css?v=' in markup
          assert json.load(request('/openapi.json'))['info']['version'] == os.environ['REMNAUM_BUILD_VERSION']
          assert request('/admin/api/release-version').status == 401
          assert request('/api/v1/store-profile/welcome-image').status == 404
          assert request('/static/miniapp.js').status == 200
          assert request('/static/miniapp.css').status == 200
          assert request('/static/admin.js').status == 200
          assert request('/static/store.css').status == 200
          assert request('/api/v1/store/catalog', host='web.example.com').status == 200
          assert request('/api/v1/store/me', host='web.example.com').status == 401
          assert request('/admin/api/referrals').status == 401
          assert request('/admin/api/trial').status == 401
          assert request('/admin/api/promos').status == 401
          assert request('/admin/api/bot-identity').status == 401
          assert request('/admin/api/documents').status == 401
          assert request('/admin/api/documents/terms', 'PUT', payload='{"body":"test"}').status == 401
          assert request('/admin/api/notifications').status == 401
          assert request('/admin/api/operations').status == 401
          assert request('/api/v1/webapp/tickets').status == 401
          assert request('/api/v1/webapp/theme').status == 401
          assert request('/store-theme.css').status == 200
          assert request('/admin/api/theme', 'PUT', payload='{"colors":{}}').status == 401
          assert request('/api/v1/webapp/notifications').status == 401
          assert request('/admin/api/store-profile/welcome-image', 'PUT', payload='{"data_base64":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}').status == 401
          assert request('/api/v1/webapp/offers').status == 401
          assert request('/api/v1/webapp/external/checkout', 'POST', payload='{"provider":"yookassa","days":30,"traffic":50,"devices":1}').status == 401
          assert request('/api/v1/webapp/plans/external/checkout', 'POST', payload='{"provider":"cryptopay","plan_id":1}').status == 401
          assert request('/api/v1/webapp/trial', 'POST').status == 401
          assert request('/webhooks/remnawave', 'POST', 'webhook.example.com').status == 401
          print('Public storefront/miniapp and unauthenticated protected routes verified')
          PY
      - name: Test active Nginx proxy after application is healthy
        if: matrix.mode == 'standalone'
        run: |
          docker compose up -d nginx
          for i in $(seq 1 20); do
            if docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://nginx/health', timeout=3).status == 200" >/dev/null 2>&1; then
              echo "Nginx proxy to Remnaum is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Nginx did not proxy a healthy Remnaum API" >&2
          exit 1
      - name: Verify restart preserves empty database
        run: |
          docker compose restart app
          sleep 5
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM users;')" = "0"
      - name: Verify promo redemption is persisted and cannot repeat
        run: |
          docker compose exec -T app python - <<'PY'
          import asyncio
          from app.db.models import User
          from app.db.session import SessionLocal
          from app.services.promos import create_promo, redeem_promo, promo_balance
          from app.services.trials import trial_eligible, get_trial_settings
          async def main():
              async with SessionLocal() as session:
                  session.add(User(telegram_id=123456789, username="smoke"))
                  await session.commit()
              promo = await create_promo("SMOKE7", 7, 5)
              assert promo["used_count"] == 0
              first = await redeem_promo(123456789, "smoke7")
              assert first["bonus_days"] == 7
              assert (await promo_balance(123456789))["days"] == 7
              try:
                  await redeem_promo(123456789, "SMOKE7")
              except ValueError:
                  pass
              else:
                  raise AssertionError("Promo was redeemed twice")
              assert (await get_trial_settings())["enabled"] is False
              assert not await trial_eligible(123456789)
          asyncio.run(main())
          PY
      - name: Recover a mismatched PostgreSQL password and preserve data
        run: |
          pg=$(docker compose ps -q postgres)
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://remnaum:wrong-test-password@postgres:5432/remnaum|' .env
          sudo env PYTHONPATH=scripts python3 -c 'from install import rotate_postgres_password; rotate_postgres_password("ci-rotated-password-123")'
          test "$(sudo docker compose ps -q postgres)" = "$pg"
          test "$(sudo docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM promo_redemptions;')" = "1"
          sudo docker compose run --rm --no-deps -T --entrypoint python app -m app.db.check_connection
          sudo docker compose exec -T app python - <<'PY'
          import base64, io
          from PIL import Image
          from app.services.store_media import save_welcome_image, welcome_image_path
          image = io.BytesIO()
          Image.new('RGB', (200, 120)).save(image, format='PNG')
          save_welcome_image(base64.b64encode(image.getvalue()).decode())
          assert welcome_image_path().is_file()
          PY
      - name: Simulate reinstall over an existing PostgreSQL volume
        run: |
          sudo sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=fresh-reinstall-password-123|' .env
          sudo sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://remnaum:fresh-reinstall-password-123@postgres:5432/remnaum|' .env
          # A removed source directory does not remove Docker volumes.
          # The recovery must require explicit consent and keep old records.
          sudo env PYTHONPATH=scripts python3 - <<'PY'
          from unittest.mock import patch
          from install import read_env, ensure_install_postgres_connection
          with patch("install.prompt", return_value="да"):
              ensure_install_postgres_connection(read_env())
          PY
          test "$(sudo docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM promo_redemptions;')" = "1"
          sudo docker compose run --rm --no-deps -T --entrypoint python app -m app.db.check_connection
          sudo docker compose up -d --no-deps --force-recreate app
          for i in $(seq 1 30); do
            if sudo docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=3).status==200" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          sudo docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=5).status==200"
      - name: Verify encrypted full backup and restore PostgreSQL and Redis
        run: |
          sudo mkdir -p backups
          printf '%s\n' 'ci-test-only-recovery-key-not-for-production-12345' | sudo tee backups/.recovery-key >/dev/null
          sudo chmod 600 backups/.recovery-key
          sudo docker compose exec -T redis redis-cli SET remnaum:restore-smoke before-backup
          sudo python3 scripts/backup_manager.py create
          ARCHIVE="$(sudo find backups -maxdepth 1 -name 'remnaum-full-*.rmb' | sort | tail -1)"
          sudo test -s "$ARCHIVE"
          sudo python3 scripts/backup_manager.py inspect "$ARCHIVE" | grep -q '"product": "remnaum"'
          sudo env PYTHONPATH=scripts python3 -c 'from install import rotate_postgres_password; rotate_postgres_password("ci-after-backup-password-123")'
          sudo docker compose exec -T postgres psql -U remnaum -d remnaum -c 'DELETE FROM promo_redemptions;'
          test "$(sudo docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM promo_redemptions;')" = "0"
          sudo docker compose exec -T redis redis-cli SET remnaum:restore-smoke after-backup
          sudo python3 scripts/backup_manager.py restore "$ARCHIVE"
          test "$(sudo docker compose exec -T redis redis-cli --raw GET remnaum:restore-smoke)" = "before-backup"
          test "$(sudo docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM promo_redemptions;')" = "1"
          for i in $(seq 1 35); do
            if sudo docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          sudo docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status==200"
      - name: Show logs on failure
        if: failure()
        run: sudo docker compose logs --tail=200
      - name: Stop
        if: always()
        run: |
          sudo docker compose down
          docker rm -f simulated-panel-proxy || true
