name: Integration smoke
on:
  push:
    branches: ["main", "feat/dual-deployment-modes"]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, panel, panel-network]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated topology
        run: |
          cp .env.example .env
          chmod 600 .env
          if [ "${{ matrix.mode }}" = panel ]; then
            sed -i 's|^DEPLOY_MODE=.*|DEPLOY_MODE=panel|' .env
            sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.panel.yaml|' .env
          elif [ "${{ matrix.mode }}" = panel-network ]; then
            docker network create remnawave-network
            sed -i 's|^DEPLOY_MODE=.*|DEPLOY_MODE=panel|' .env
            sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.panel.yaml:compose.panel-network.yaml|' .env
            sed -i 's|^REMNAUM_PROXY_NETWORK=.*|REMNAUM_PROXY_NETWORK=remnawave-network|' .env
          fi
      - name: Validate scripts, installer and Compose isolation
        run: |
          sh -n install.sh
          bash -n update.sh backup.sh
          python3 -m py_compile scripts/install.py
          python3 -m unittest discover -s tests -p 'test_installer.py' -v
          docker compose config --quiet
          python3 - <<'PY'
          import json
          import subprocess
          import os
          data = json.loads(subprocess.check_output(["docker", "compose", "config", "--format", "json"], text=True))
          mode = "${{ matrix.mode }}"
          services = data["services"]
          if mode == "standalone":
              assert "caddy" in services and "nginx" in services, services
              assert {str(p["published"]) for p in services["caddy"]["ports"]} >= {"80","443"}
              assert not services["app"].get("ports")
          else:
              assert "caddy" not in services and "nginx" not in services
              ports = services["app"]["ports"]
              assert len(ports) == 1 and ports[0]["host_ip"] == "127.0.0.1", ports
              assert str(ports[0]["published"]) == "18080"
              if mode == "panel-network":
                  assert "panel_proxy" in services["app"]["networks"]
          print("Deployment mode", mode, "validated")
          PY
      - name: Validate Caddy configuration (standalone only)
        if: matrix.mode == 'standalone'
        run: docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Simulate existing Panel owning public 80/443
        if: matrix.mode != 'standalone'
        run: |
          docker run -d --name simulated-panel-proxy -p 80:80 -p 443:80 nginx:1.27-alpine
      - name: Start empty database and API
        run: docker compose up -d --build postgres redis app
      - name: Validate Nginx configuration (standalone only)
        if: matrix.mode == 'standalone'
        run: docker compose run --rm --no-deps --entrypoint nginx nginx -t
      - name: Verify health and clean data
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8080/health').status)" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8080/health').status == 200"
          if [ "${{ matrix.mode }}" != standalone ]; then
            curl -fsS http://127.0.0.1:18080/health
            test "$(docker inspect -f '{{.State.Running}}' simulated-panel-proxy)" = "true"
          fi
          if [ "${{ matrix.mode }}" = panel-network ]; then
            docker compose exec -T app python -c "import socket; assert socket.gethostbyname('remnaum-api')"
          fi
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM users;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM payments;')" = "0"
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM subscriptions;')" = "0"
      - name: Test active Nginx proxy after application is healthy
        if: matrix.mode == 'standalone'
        run: |
          docker compose up -d nginx
          for i in $(seq 1 20); do
            if docker compose exec -T app python -c "import urllib.request; assert urllib.request.urlopen('http://nginx/health', timeout=3).status == 200" >/dev/null 2>&1; then
              echo "Nginx proxy to Remnaum is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Nginx did not proxy a healthy Remnaum API" >&2
          exit 1
      - name: Verify restart preserves empty database
        run: |
          docker compose restart app
          sleep 5
          test "$(docker compose exec -T postgres psql -U remnaum -d remnaum -Atc 'SELECT COUNT(*) FROM users;')" = "0"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop
        if: always()
        run: |
          docker compose down
          docker rm -f simulated-panel-proxy || true
