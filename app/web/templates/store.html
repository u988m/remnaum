<!doctype html>
<html lang="ru" data-theme="monochrome">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VPN-магазин</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/store.css">
</head>
<body>
<main>
  <header class="store-header" id="name">Remnaum</header>
  <h1>Тарифы</h1>
  <p id="description" class="muted" hidden></p>
  <fieldset id="plans" class="store-plans" aria-label="Выбор тарифа">
    <p class="muted">Загружаем тарифы…</p>
  </fieldset>
  <section class="store-panel" id="login" hidden>
    <h2>Вход через Telegram</h2>
    <p class="muted">Войдите, чтобы оформить подписку на свой аккаунт.</p>
    __LOGIN_WIDGET__
  </section>
  <section class="store-panel" id="account" hidden>
    <h2>Оплата</h2>
    <p id="hello" class="muted"></p>
    <p id="selected-plan" class="store-summary">Выберите тариф.</p>
    <form id="checkout" class="store-form">
      <label class="store-field">Способ оплаты<select id="provider" required></select></label>
      <label class="store-consent" hidden><input type="checkbox" id="terms"><span>Принимаю <a id="terms-url" target="_blank" rel="noopener">условия продажи</a></span></label>
      <button class="primary-btn" id="buy" type="submit" disabled>Перейти к оплате</button>
    </form>
    <p id="status" class="muted" role="status"></p>
  </section>
</main>
<script src="/static/store.js" defer></script>
</body>
</html>
