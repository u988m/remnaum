services:
  app:
    build: .
    container_name: remnaum-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
  postgres:
    image: postgres:16-alpine
    container_name: remnaum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: remnaum
      POSTGRES_USER: remnaum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remnaum-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remnaum -d remnaum"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: remnaum-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
