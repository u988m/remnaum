# Remnaum core stack. No host ports are published by default.
# The installer selects a deployment overlay via COMPOSE_FILE in .env.
services:
  app:
    build:
      context: .
      args:
        REMNAUM_BUILD_VERSION: ${REMNAUM_BUILD_VERSION:-0.0.0+dev}
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: remnaum
      POSTGRES_USER: remnaum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U remnaum -d remnaum"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
volumes:
  postgres_data:
  redis_data:
